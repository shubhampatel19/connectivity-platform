name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Shell scripts
        run: shellcheck scripts/*.sh
      - name: Prometheus config and alert rules
        run: |
          docker run --rm -v "$PWD/prometheus:/etc/prometheus:ro" \
            --entrypoint promtool prom/prometheus:v2.53.0 \
            check config /etc/prometheus/prometheus.yml
      - name: Alert rule unit tests
        run: |
          docker run --rm -v "$PWD/prometheus:/etc/prometheus:ro" \
            --entrypoint promtool prom/prometheus:v2.53.0 \
            test rules /etc/prometheus/alerts_test.yml
      - name: Grafana dashboard JSON
        run: python3 -m json.tool grafana/provisioning/dashboards/connectivity-overview.json > /dev/null

  # Runs the whole stack the way `make up` does and checks that telemetry from
  # simulated devices actually lands in Postgres, from both sites, including
  # site B's data that the gateway held through a cloud outage; that device
  # faults become exactly the cases they should; and that replaying every
  # alert changes nothing.
  smoke:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DEVICE_COUNT: "50"
      SITE_B_DEVICE_COUNT: "30"
      SEND_INTERVAL: 2s
      BUNDLE_INTERVAL: 20s
      BUNDLE_TRACE_BYTES: "262144"
      # No spontaneous faults: every alert in this run is one the test injected.
      FAULT_RATE: "0"
    steps:
      - uses: actions/checkout@v5
        with:
          path: connectivity-platform

      - name: Clone component repos
        run: |
          for repo in connectivity-edge-agent connectivity-ingest-api connectivity-telemetry-processor connectivity-site-gateway connectivity-case-service; do
            git clone --depth 1 "https://github.com/${{ github.repository_owner }}/$repo.git"
          done

      - name: Start the stack
        working-directory: connectivity-platform
        run: |
          if ! docker compose up -d --build > /tmp/compose-up.log 2>&1; then
            cat /tmp/compose-up.log
            # Annotations are readable through the API, unlike raw job logs.
            echo "::error title=docker compose up failed::$(tail -n 25 /tmp/compose-up.log | sed -e ':a' -e 'N' -e '$!ba' -e 's/%/%25/g' -e 's/\r//g' -e 's/\n/%0A/g')"
            exit 1
          fi
          cat /tmp/compose-up.log

      - name: Wait for telemetry in Postgres
        working-directory: connectivity-platform
        run: |
          q() { docker compose exec -T postgres psql -U connectivity -d connectivity -tAc "$1" 2>/dev/null || echo 0; }
          for _ in $(seq 1 60); do
            [ "$(q 'SELECT count(*) FROM telemetry')" -gt 0 ] && break
            sleep 5
          done
          echo "devices registered: $(q 'SELECT count(*) FROM devices')"
          echo "batches stored:     $(q 'SELECT count(*) FROM ingested_batches')"
          echo "samples stored:     $(q 'SELECT count(*) FROM telemetry')"
          [ "$(q 'SELECT count(*) FROM telemetry')" -gt 0 ] || { echo "::error::no telemetry reached Postgres within 5 minutes"; exit 1; }
          [ "$(q 'SELECT count(*) FROM devices')" -gt 0 ] || { echo "::error::no devices were registered"; exit 1; }
          # Batch markers and samples commit in one transaction, so these must always agree.
          [ "$(q 'SELECT (SELECT coalesce(sum(sample_count),0) FROM ingested_batches) = (SELECT count(*) FROM telemetry)')" = t ] \
            || { echo "::error::sample count does not match batch markers"; exit 1; }

      - name: Wait for a log bundle in Postgres and the object store
        working-directory: connectivity-platform
        run: |
          q() { docker compose exec -T postgres psql -U connectivity -d connectivity -tAc "$1" 2>/dev/null || echo 0; }
          for _ in $(seq 1 60); do
            [ "$(q 'SELECT count(*) FROM log_bundles')" -gt 0 ] && break
            sleep 5
          done
          [ "$(q 'SELECT count(*) FROM log_bundles')" -gt 0 ] || { echo "::error::no log bundle was indexed within 5 minutes"; exit 1; }
          read -r key size <<<"$(q "SELECT object_key || ' ' || size_bytes FROM log_bundles ORDER BY indexed_at LIMIT 1")"
          echo "bundles indexed: $(q 'SELECT count(*) FROM log_bundles'); checking $key ($size bytes)"
          # S3 buckets live under /buckets in the SeaweedFS filer.
          stored=$(docker compose exec -T object-store curl -sI "http://localhost:8888/buckets/log-bundles/$key" | awk 'tolower($1) == "content-length:" {print $2}' | tr -d '\r')
          [ "$stored" = "$size" ] || { echo "::error::$key is '$stored' bytes in the object store but the index says $size"; exit 1; }
          echo "object in the object store matches the index"

      - name: "Alerts become cases: one device, then a site-wide storm through the gateway"
        working-directory: connectivity-platform
        run: |
          api()  { curl -fsS "localhost:8085$1"; }
          py()   { python3 -c "$1"; }
          for _ in $(seq 1 24); do curl -fsS -o /dev/null localhost:8085/readyz && break; sleep 5; done
          curl -fsS -o /dev/null localhost:8085/readyz || { echo "::error::the case service never became ready"; exit 1; }

          # 1. One overheating device at site A: exactly one device case, and its log bundle attaches.
          dev=$(curl -fsS -X POST 'localhost:9102/debug/faults?kind=thermal&devices=1' | py 'import json,sys; print(json.load(sys.stdin)["devices"][0])')
          echo "injected an overheat on $dev"
          dev_cases() { api "/v1/cases?status=all&device=$dev"; }
          for _ in $(seq 1 36); do [ "$(dev_cases | py 'import json,sys; print(len(json.load(sys.stdin)["cases"]))')" -ge 1 ] && break; sleep 5; done
          read -r n scope rule id <<<"$(dev_cases | py 'import json,sys; c=json.load(sys.stdin)["cases"]; print(len(c), *( (c[0]["scope"], c[0]["rule_id"], c[0]["case_id"]) if c else ("-","-","-")))')"
          echo "cases for $dev: $n ($scope, $rule, #$id)"
          [ "$n" = 1 ] && [ "$scope" = device ] && [ "$rule" = thermal-critical ] \
            || { echo "::error::one overheat on $dev should open exactly one thermal device case, got $n ($scope $rule)"; exit 1; }
          for _ in $(seq 1 36); do [ "$(api "/v1/cases/$id" | py 'import json,sys; print(json.load(sys.stdin)["logs"])')" = attached ] && break; sleep 5; done
          logs=$(api "/v1/cases/$id" | py 'import json,sys; print(json.load(sys.stdin)["logs"])')
          [ "$logs" = attached ] || { echo "::error::case #$id never got its log bundle (logs: $logs)"; exit 1; }

          # 2. Every site B device overheats at once, through the gateway: one site case, not 30.
          hit=$(curl -fsS -X POST 'localhost:9103/debug/faults?kind=thermal&devices=all' | py 'import json,sys; print(len(json.load(sys.stdin)["devices"]))')
          echo "injected an overheat on all $hit site B devices"
          storm() {
            api "/v1/cases?status=open&site=site-b&rule=thermal-critical&limit=500" | py '
          import json, sys
          c = json.load(sys.stdin)["cases"]
          site = [x for x in c if x["scope"] == "site"]
          dev = [x for x in c if x["scope"] == "device"]
          orphans = [x for x in dev if not site or x.get("parent_case_id") != site[0]["case_id"]]
          print(len(site), site[0]["devices"] if site else 0, len(dev), len(orphans), site[0]["case_id"] if site else "-")'
          }
          for _ in $(seq 1 36); do read -r sites devices dcases orphans sid <<<"$(storm)"; [ "$sites" -ge 1 ] && [ "$devices" -ge "$hit" ] && break; sleep 5; done
          read -r sites devices dcases orphans sid <<<"$(storm)"
          echo "site B: $sites site case(s), #$sid covering $devices devices; $dcases device cases, $orphans not under it"
          echo "::notice title=storm::site case #$sid covers $devices of $hit site B devices; $dcases device cases opened before it, all adopted: $([ "$orphans" = 0 ] && echo yes || echo no)"
          [ "$sites" = 1 ] || { echo "::error::expected exactly one open site case for site B, got $sites"; exit 1; }
          [ "$devices" -ge "$hit" ] || { echo "::error::the site case covers $devices devices, expected all $hit"; exit 1; }
          [ "$dcases" -lt 5 ] || { echo "::error::$dcases device cases opened at site B; the storm rule should stop at 4"; exit 1; }
          [ "$orphans" = 0 ] || { echo "::error::$orphans site B device cases are not children of the site case"; exit 1; }
          [ "$(api '/v1/cases?status=open&site=site-a&rule=thermal-critical' | py 'import json,sys; print(sum(x["scope"] == "site" for x in json.load(sys.stdin)["cases"]))')" = 0 ] \
            || { echo "::error::site A got a site case from a single device"; exit 1; }

      - name: "Store-and-forward: site B through a cloud outage"
        working-directory: connectivity-platform
        run: |
          q()  { docker compose exec -T postgres psql -U connectivity -d connectivity -tAc "$1" 2>/dev/null || echo 0; }
          gm() { curl -s localhost:8090/metrics | awk -v m="$1" 'index($1, m) == 1 && (length($1) == length(m) || substr($1, length(m) + 1, 1) == "{") {t += $2} END {printf "%d\n", t}'; }
          site_b_batches() { q "SELECT count(*) FROM ingested_batches b JOIN devices d USING (device_id) WHERE d.site_id = 'site-b'"; }

          # 1. Site B's devices reach the cloud through the gateway.
          for _ in $(seq 1 36); do [ "$(site_b_batches)" -gt 0 ] && break; sleep 5; done
          [ "$(site_b_batches)" -gt 0 ] || { echo "::error::no site B telemetry reached Postgres through the gateway"; exit 1; }
          inv=$(curl -s localhost:8090/gateway/v1/devices | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(sum(x["status"] == "online" for x in d))')
          echo "site B: $(site_b_batches) batches stored, $inv devices online in the gateway inventory"
          [ "$inv" -gt 0 ] || { echo "::error::the gateway inventory has no online devices"; exit 1; }
          [ "$(gm connectivity_gateway_queue_records)" -eq 0 ] || { echo "::error::the gateway has a backlog while the cloud is healthy"; exit 1; }
          queued0=$(gm connectivity_gateway_queued_total); fwd0=$(gm connectivity_gateway_forwarded_total)

          # 2. Cloud outage: the gateway keeps acking site B and queues to disk,
          #    including an alert raised mid-outage (checked in the next step).
          t0=$(date +%s)
          docker compose stop ingest-api
          curl -fsS -X POST 'localhost:9103/debug/faults?kind=disk&devices=1' | python3 -c 'import json,sys; print(json.load(sys.stdin)["devices"][0])' > /tmp/outage-device
          echo "injected a disk fault on $(cat /tmp/outage-device) during the outage"
          sleep 45
          alerts_queued=$(curl -s localhost:8090/metrics | awk '/^connectivity_gateway_queued_total\{kind="alerts"\}/ {print int($2)}')
          echo "alerts queued at the gateway during the outage: ${alerts_queued:-0}"
          [ "${alerts_queued:-0}" -ge 1 ] || { echo "::error::the gateway did not queue the alert raised during the outage"; exit 1; }
          backlog=$(gm connectivity_gateway_queue_records)
          echo "after 45s of outage the gateway holds $backlog batches"
          [ "$backlog" -gt 0 ] || { echo "::error::the gateway did not queue anything during the outage"; exit 1; }
          curl -fsS -o /dev/null localhost:8090/readyz || { echo "::error::gateway readiness followed the cloud down"; exit 1; }

          # 3. Recovery: the queue drains completely, nothing is dropped.
          docker compose start ingest-api
          t1=$(date +%s)
          for _ in $(seq 1 36); do [ "$(gm connectivity_gateway_queue_records)" -eq 0 ] && break; sleep 5; done
          [ "$(gm connectivity_gateway_queue_records)" -eq 0 ] || { echo "::error::the gateway queue did not drain within 3 minutes of recovery"; exit 1; }
          queued=$(( $(gm connectivity_gateway_queued_total) - queued0 )); forwarded=$(( $(gm connectivity_gateway_forwarded_total) - fwd0 ))
          dropped=$(gm connectivity_gateway_queue_dropped_total)
          echo "outage: $queued batches queued, $forwarded forwarded, $dropped dropped"
          [ "$dropped" -eq 0 ] || { echo "::error::the gateway dropped $dropped batches"; exit 1; }
          [ "$queued" -eq "$forwarded" ] || { echo "::error::queued $queued batches but forwarded $forwarded"; exit 1; }

          # 4. Nothing site B sampled during the outage is missing from Postgres:
          #    every device has data across the whole window, with no gap longer
          #    than a few send intervals. A lost queue would leave a hole the
          #    length of the outage in every device's series.
          window="t.ts BETWEEN to_timestamp($t0) AND to_timestamp($t1)"
          gaps() { q "SELECT count(*) FROM (SELECT ts - lag(ts) OVER (PARTITION BY device_id, metric ORDER BY ts) AS gap FROM telemetry t JOIN devices d USING (device_id) WHERE d.site_id = 'site-b' AND $window) g WHERE gap > interval '10 seconds'"; }
          covered() { q "SELECT count(DISTINCT device_id) FROM telemetry t JOIN devices d USING (device_id) WHERE d.site_id = 'site-b' AND $window AND t.ts > to_timestamp($t1 - 10)"; }
          for _ in $(seq 1 24); do [ "$(gaps)" -eq 0 ] && [ "$(covered)" -ge "$SITE_B_DEVICE_COUNT" ] && break; sleep 5; done
          echo "site B devices with data through the end of the outage: $(covered) of $SITE_B_DEVICE_COUNT; gaps over 10s: $(gaps)"
          [ "$(covered)" -ge "$SITE_B_DEVICE_COUNT" ] || { echo "::error::some site B devices have no data for the end of the outage"; exit 1; }
          [ "$(gaps)" -eq 0 ] || { echo "::error::site B telemetry has gaps over the outage window; queued data was lost"; exit 1; }
          [ "$(q 'SELECT (SELECT coalesce(sum(sample_count),0) FROM ingested_batches) = (SELECT count(*) FROM telemetry)')" = t ] \
            || { echo "::error::sample count does not match batch markers after the outage"; exit 1; }

      - name: An alert queued at the gateway during the outage became a case
        working-directory: connectivity-platform
        run: |
          dev=$(cat /tmp/outage-device)
          disk_cases() { curl -fsS "localhost:8085/v1/cases?status=all&device=$dev&rule=disk-reallocating" | python3 -c 'import json,sys; print(len(json.load(sys.stdin)["cases"]))'; }
          for _ in $(seq 1 24); do [ "$(disk_cases)" -ge 1 ] && break; sleep 5; done
          [ "$(disk_cases)" = 1 ] || { echo "::error::the disk fault $dev raised during the outage did not become exactly one case (got $(disk_cases))"; exit 1; }
          pending=$(curl -s localhost:9103/metrics | awk '/^connectivity_agent_alerts_pending / {print int($2)}')
          echo "disk case for $dev opened after the outage; site B alerts still pending at the edge: $pending"
          [ "$pending" = 0 ] || { echo "::error::site B devices still hold $pending alerts after recovery"; exit 1; }

      - name: Replaying every alert from offset 0 changes nothing
        working-directory: connectivity-platform
        run: |
          q() { docker compose exec -T postgres psql -U connectivity -d connectivity -tAc "$1"; }
          snapshot() { q "SELECT count(*) || ' ' || coalesce(sum(alert_count), 0) || ' ' || count(*) FILTER (WHERE status = 'open') FROM cases.cases"; }
          before=$(snapshot); recorded=$(q 'SELECT count(*) FROM cases.alerts')
          docker compose stop case-service
          # The reset needs the group empty; a member that hasn't left yet makes it fail, so retry briefly.
          for _ in $(seq 1 12); do
            docker compose exec -T kafka /opt/kafka/bin/kafka-consumer-groups.sh --bootstrap-server localhost:9092 \
              --group case-service --reset-offsets --to-earliest --all-topics --execute > /tmp/reset.log 2>&1 && break
            sleep 5
          done
          grep -q "device.alerts" /tmp/reset.log || { cat /tmp/reset.log; echo "::error::could not reset the case-service offsets"; exit 1; }
          docker compose start case-service
          dups() { curl -s localhost:8085/metrics | awk '/^connectivity_case_alerts_total\{outcome="duplicate"\}/ {print int($2)}'; }
          for _ in $(seq 1 36); do [ "$(dups)" -ge "$recorded" ] 2>/dev/null && break; sleep 5; done
          after=$(snapshot)
          echo "replayed $(dups) alerts as duplicates (recorded: $recorded); cases/alerts/open before: $before, after: $after"
          echo "::notice title=replay::$(dups) of $recorded recorded alerts replayed as duplicates; cases, alert counts, open: $before -> $after"
          [ "$(dups)" -ge "$recorded" ] || { echo "::error::only $(dups) of $recorded alerts were replayed within 3 minutes"; exit 1; }
          [ "$before" = "$after" ] || { echo "::error::replaying alerts changed the cases: $before -> $after"; exit 1; }

      - name: Check every Prometheus target is up
        run: |
          for _ in $(seq 1 24); do
            if curl -s localhost:9090/api/v1/targets | python3 -c 'import json,sys; t=json.load(sys.stdin)["data"]["activeTargets"]; h={x["labels"]["job"] + "/" + x["labels"]["instance"]: x["health"] for x in t}; print(h); sys.exit(0 if h and all(v == "up" for v in h.values()) else 1)'; then
              exit 0
            fi
            sleep 5
          done
          echo "::error::some Prometheus targets are not up"
          exit 1

      - name: Check the ingest API and case service are ready
        run: curl -fsS -o /dev/null localhost:8080/readyz && curl -fsS -o /dev/null localhost:8085/readyz && echo "readyz ok"

      - name: Diagnostics
        if: failure()
        working-directory: connectivity-platform
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail=60
          enc() { sed -e ':a' -e 'N' -e '$!ba' -e 's/%/%25/g' -e 's/\r//g' -e 's/\n/%0A/g'; }
          echo "::error title=container states::$(docker compose ps -a --format '{{.Service}} {{.State}} {{.Status}}' | enc)"
          for svc in $(docker compose ps -a --format '{{.Service}} {{.State}} {{.ExitCode}}' | awk '$2 != "running" && !($1 == "kafka-init" && $3 == 0) {print $1}'); do
            echo "::error title=logs: $svc::$(docker compose logs --no-color --tail=20 "$svc" 2>&1 | enc)"
          done

      - name: Tear down
        if: always()
        working-directory: connectivity-platform
        run: docker compose down -v
