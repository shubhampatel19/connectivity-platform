name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shell scripts
        run: shellcheck scripts/*.sh
      - name: Prometheus config and alert rules
        run: |
          docker run --rm -v "$PWD/prometheus:/etc/prometheus:ro" \
            --entrypoint promtool prom/prometheus:v2.53.0 \
            check config /etc/prometheus/prometheus.yml
      - name: Grafana dashboard JSON
        run: python3 -m json.tool grafana/provisioning/dashboards/connectivity-overview.json > /dev/null

  # Runs the whole stack the way `make up` does and checks that telemetry from
  # simulated devices actually lands in Postgres.
  smoke:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DEVICE_COUNT: "50"
      SEND_INTERVAL: 2s
      BUNDLE_INTERVAL: 20s
      BUNDLE_TRACE_BYTES: "262144"
    steps:
      - uses: actions/checkout@v4
        with:
          path: connectivity-platform

      - name: Clone component repos
        run: |
          for repo in connectivity-edge-agent connectivity-ingest-api connectivity-telemetry-processor; do
            git clone --depth 1 "https://github.com/${{ github.repository_owner }}/$repo.git"
          done

      - name: Start the stack
        working-directory: connectivity-platform
        run: |
          if ! docker compose up -d --build > /tmp/compose-up.log 2>&1; then
            cat /tmp/compose-up.log
            # Annotations are readable through the API, unlike raw job logs.
            echo "::error title=docker compose up failed::$(tail -n 25 /tmp/compose-up.log | sed -e ':a' -e 'N' -e '$!ba' -e 's/%/%25/g' -e 's/\r//g' -e 's/\n/%0A/g')"
            exit 1
          fi
          cat /tmp/compose-up.log

      - name: Wait for telemetry in Postgres
        working-directory: connectivity-platform
        run: |
          q() { docker compose exec -T postgres psql -U connectivity -d connectivity -tAc "$1" 2>/dev/null || echo 0; }
          for _ in $(seq 1 60); do
            [ "$(q 'SELECT count(*) FROM telemetry')" -gt 0 ] && break
            sleep 5
          done
          echo "devices registered: $(q 'SELECT count(*) FROM devices')"
          echo "batches stored:     $(q 'SELECT count(*) FROM ingested_batches')"
          echo "samples stored:     $(q 'SELECT count(*) FROM telemetry')"
          [ "$(q 'SELECT count(*) FROM telemetry')" -gt 0 ] || { echo "::error::no telemetry reached Postgres within 5 minutes"; exit 1; }
          [ "$(q 'SELECT count(*) FROM devices')" -gt 0 ] || { echo "::error::no devices were registered"; exit 1; }
          # Batch markers and samples commit in one transaction, so these must always agree.
          [ "$(q 'SELECT (SELECT coalesce(sum(sample_count),0) FROM ingested_batches) = (SELECT count(*) FROM telemetry)')" = t ] \
            || { echo "::error::sample count does not match batch markers"; exit 1; }

      - name: Wait for a log bundle in Postgres and MinIO
        working-directory: connectivity-platform
        run: |
          q() { docker compose exec -T postgres psql -U connectivity -d connectivity -tAc "$1" 2>/dev/null || echo 0; }
          for _ in $(seq 1 60); do
            [ "$(q 'SELECT count(*) FROM log_bundles')" -gt 0 ] && break
            sleep 5
          done
          [ "$(q 'SELECT count(*) FROM log_bundles')" -gt 0 ] || { echo "::error::no log bundle was indexed within 5 minutes"; exit 1; }
          read -r key size <<<"$(q "SELECT object_key || ' ' || size_bytes FROM log_bundles ORDER BY indexed_at LIMIT 1")"
          echo "bundles indexed: $(q 'SELECT count(*) FROM log_bundles'); checking $key ($size bytes)"
          docker compose exec -T minio mc alias set local http://localhost:9000 connectivity connectivity-secret > /dev/null
          stored=$(docker compose exec -T minio mc stat --json "local/log-bundles/$key" | python3 -c 'import json,sys; print(json.load(sys.stdin)["size"])')
          [ "$stored" = "$size" ] || { echo "::error::$key is $stored bytes in MinIO but the index says $size"; exit 1; }
          echo "object in MinIO matches the index"

      - name: Check every Prometheus target is up
        run: |
          for _ in $(seq 1 24); do
            if curl -s localhost:9090/api/v1/targets | python3 -c 'import json,sys; t=json.load(sys.stdin)["data"]["activeTargets"]; h={x["labels"]["job"]: x["health"] for x in t}; print(h); sys.exit(0 if h and all(v == "up" for v in h.values()) else 1)'; then
              exit 0
            fi
            sleep 5
          done
          echo "::error::some Prometheus targets are not up"
          exit 1

      - name: Check the ingest API is ready
        run: curl -fsS -o /dev/null localhost:8080/readyz && echo "readyz ok"

      - name: Diagnostics
        if: failure()
        working-directory: connectivity-platform
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail=60
          enc() { sed -e ':a' -e 'N' -e '$!ba' -e 's/%/%25/g' -e 's/\r//g' -e 's/\n/%0A/g'; }
          echo "::error title=container states::$(docker compose ps -a --format '{{.Service}} {{.State}} {{.Status}}' | enc)"
          for svc in $(docker compose ps -a --format '{{.Service}} {{.State}} {{.ExitCode}}' | awk '$2 != "running" && !($1 == "kafka-init" && $3 == 0) {print $1}'); do
            echo "::error title=logs: $svc::$(docker compose logs --no-color --tail=20 "$svc" 2>&1 | enc)"
          done

      - name: Tear down
        if: always()
        working-directory: connectivity-platform
        run: docker compose down -v
