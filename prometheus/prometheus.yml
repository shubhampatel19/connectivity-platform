global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: ingest-api
    static_configs:
      - targets: ["ingest-api:8080"]
  - job_name: telemetry-processor
    static_configs:
      - targets: ["telemetry-processor:9101"]
  - job_name: edge-agent
    static_configs:
      - targets: ["edge-agent:9102"]
        labels:
          site: site-a
  - job_name: kafka
    static_configs:
      - targets: ["kafka-exporter:9308"]
  - job_name: object-store
    static_configs:
      - targets: ["object-store:9324"]
