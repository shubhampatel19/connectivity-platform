# Alerts are the entry point of every drill: something fires, you start from
# the dashboard, and work inward. Thresholds are tuned for the default fleet
# (200 devices at site A, 100 behind the site B gateway); adjust if you
# change DEVICE_COUNT or SITE_B_DEVICE_COUNT.
groups:
  - name: connectivity
    rules:
      - alert: IngestionErrorRateHigh
        expr: |
          sum(rate(connectivity_ingest_http_requests_total{code=~"5.."}[2m]))
            / clamp_min(sum(rate(connectivity_ingest_http_requests_total[2m])), 1e-9) > 0.05
        for: 2m
        labels: { severity: page }
        annotations:
          summary: More than 5% of ingestion requests are failing with 5xx.

      - alert: AgentSendFailures
        expr: sum by (site) (rate(connectivity_agent_send_failures_total[2m])) > 0.5
        for: 2m
        labels: { severity: page }
        annotations:
          summary: "Devices at {{ $labels.site }} are failing to deliver telemetry and are buffering locally."

      - alert: AgentDroppingSamples
        expr: sum by (site) (rate(connectivity_agent_samples_dropped_total[5m])) > 0
        for: 1m
        labels: { severity: page }
        annotations:
          summary: "Device buffers at {{ $labels.site }} are full and overwriting data. This is data loss."

      - alert: ConsumerLagHigh
        expr: sum(kafka_consumergroup_lag{consumergroup="telemetry-processor"}) > 2000
        for: 3m
        labels: { severity: page }
        annotations:
          summary: The processor is falling behind Kafka.

      - alert: ProcessorRetrying
        expr: sum(rate(connectivity_processor_retries_total[2m])) > 0
        for: 2m
        labels: { severity: ticket }
        annotations:
          summary: The processor is retrying records; a dependency is failing.

      - alert: IngestToStoreSlow
        expr: |
          histogram_quantile(0.95,
            sum by (le) (rate(connectivity_processor_ingest_to_store_seconds_bucket[5m]))) > 30
        for: 5m
        labels: { severity: ticket }
        annotations:
          summary: p95 time from ingestion to storage is above 30s.

      - alert: TargetDown
        expr: up == 0
        for: 1m
        labels: { severity: page }
        annotations:
          summary: "{{ $labels.job }} is not being scraped."

      - alert: ObjectStoreErrors
        expr: sum(rate(connectivity_ingest_object_store_errors_total[2m])) > 0
        for: 2m
        labels: { severity: page }
        annotations:
          summary: The ingest API is failing to read or write the object store; log bundle uploads are stalled.

      - alert: BundleUploadsFailing
        expr: sum(rate(connectivity_agent_bundle_upload_failures_total[5m])) > 0.1
        for: 5m
        labels: { severity: ticket }
        annotations:
          summary: Devices keep failing to upload log bundles and are holding them in their spools.

      - alert: BundleSpoolBacklog
        expr: sum(connectivity_agent_spool_bundles) > 50
        for: 10m
        labels: { severity: ticket }
        annotations:
          summary: More than 50 log bundles are waiting at the edge.

      - alert: BundlesEvicted
        expr: sum(increase(connectivity_agent_bundle_uploads_total{result="evicted"}[10m])) > 0
        labels: { severity: page }
        annotations:
          summary: Edge spools are full and evicting log bundles. Support data is being lost.

      - alert: BundleChecksumFailures
        expr: sum(increase(connectivity_ingest_bundle_assembly_failures_total{reason="checksum"}[10m])) > 0
        labels: { severity: ticket }
        annotations:
          summary: Assembled bundles don't match the checksum their device declared.

  # The site gateway holds data the cloud hasn't seen yet, so its own health
  # is part of the data path. These read only the gateway's metrics.
  - name: site-gateway
    rules:
      - alert: GatewayBacklog
        expr: max by (site) (connectivity_gateway_queue_records) > 1000
        for: 3m
        labels: { severity: ticket }
        annotations:
          summary: "The {{ $labels.site }} gateway is holding {{ $value }} records the cloud hasn't accepted."
          description: Normal during a cloud outage. If the cloud is up, check the upstream outcome panel and forward failures.

      - alert: GatewayBacklogNotDraining
        expr: |
          max by (site) (connectivity_gateway_queue_records) > 0
            and on (site) sum by (site) (rate(connectivity_gateway_forwarded_total[5m])) == 0
            and on (site) sum by (site) (rate(connectivity_gateway_upstream_requests_total{outcome="ok"}[5m])) > 0
        for: 5m
        labels: { severity: page }
        annotations:
          summary: "The {{ $labels.site }} gateway reaches the cloud but isn't draining its queue."
          description: Pass-through calls succeed while nothing is forwarded, so the forwarder itself is stuck.

      - alert: GatewayDroppingData
        expr: sum by (site, reason) (increase(connectivity_gateway_queue_dropped_total[10m])) > 0
        labels: { severity: page }
        annotations:
          summary: "The {{ $labels.site }} gateway discarded queued telemetry or alerts (reason: {{ $labels.reason }}). This is data loss."

      - alert: GatewayHttpSaturated
        expr: |
          max by (site) (connectivity_gateway_http_threads_active / connectivity_gateway_http_threads_max) > 0.9
            or sum by (site) (rate(connectivity_gateway_http_rejected_total[2m])) > 0
        for: 2m
        labels: { severity: page }
        annotations:
          summary: "The {{ $labels.site }} gateway's HTTP workers are saturated; devices are being turned away."
          description: Usually a slow (not down) cloud holding workers on pass-through calls. Compare with upstream latency.

      - alert: GatewayHeapPressure
        expr: |
          max by (site) (jvm_memory_used_bytes{job="site-gateway", area="heap"}
            / (jvm_memory_max_bytes{job="site-gateway", area="heap"} > 0)) > 0.85
        for: 5m
        labels: { severity: ticket }
        annotations:
          summary: "The {{ $labels.site }} gateway's heap is over 85% of -Xmx for 5 minutes."

      - alert: GatewayGcTimeHigh
        expr: sum by (site) (rate(jvm_gc_collection_seconds_sum{job="site-gateway"}[2m])) > 0.1
        for: 5m
        labels: { severity: ticket }
        annotations:
          summary: "The {{ $labels.site }} gateway spends more than 10% of its time in garbage collection."

      - alert: GatewayDevicesOffline
        expr: |
          sum by (site) (connectivity_gateway_devices{status="offline"})
            / clamp_min(sum by (site) (connectivity_gateway_devices), 1) > 0.1
        for: 5m
        labels: { severity: ticket }
        annotations:
          summary: "More than 10% of the devices the {{ $labels.site }} gateway knows about have gone silent."

  # Device alerts and support cases. A fault that never becomes a case is
  # invisible to support, so the alert path is watched end to end: devices
  # holding or losing alerts, the cloud refusing them, the case service
  # falling behind, and cases that open without their logs.
  - name: cases
    rules:
      - alert: AgentAlertsDropped
        expr: sum by (site) (increase(connectivity_agent_alerts_dropped_total[10m])) > 0
        labels: { severity: page }
        annotations:
          summary: "Devices at {{ $labels.site }} discarded alerts because their outbox was full. Those faults will never reach support."

      - alert: AgentAlertsStuck
        expr: sum by (site) (connectivity_agent_alerts_pending) > 0
        for: 10m
        labels: { severity: ticket }
        annotations:
          summary: "Devices at {{ $labels.site }} have held undelivered alerts for 10 minutes."
          description: Check the agent's alert send failures by reason. endpoint_missing means the cloud (or gateway) doesn't have /v1/alerts.

      - alert: AlertsRejected
        expr: |
          sum(increase(connectivity_ingest_alerts_rejected_total[10m]))
            + sum(increase(connectivity_case_alerts_rejected_total[10m])) > 0
        labels: { severity: ticket }
        annotations:
          summary: The cloud is refusing device alerts as invalid. Usually an agent release sending something the contract doesn't allow.

      - alert: CaseServiceLag
        expr: sum(kafka_consumergroup_lag{consumergroup="case-service"}) > 100
        for: 3m
        labels: { severity: page }
        annotations:
          summary: The case service is falling behind on alerts; new faults are not becoming cases.

      - alert: CaseServiceRetrying
        expr: sum(rate(connectivity_case_retries_total[2m])) > 0
        for: 2m
        labels: { severity: ticket }
        annotations:
          summary: The case service is retrying records; a dependency (usually Postgres) is failing.

      - alert: CaseDecisionSlow
        expr: histogram_quantile(0.95, sum by (le) (rate(connectivity_case_alert_delay_seconds_bucket[5m]))) > 60
        for: 5m
        labels: { severity: ticket }
        annotations:
          summary: p95 time from an alert reaching the cloud to a case decision is above 60s.

      - alert: SiteCaseOpened
        expr: sum by (rule) (increase(connectivity_case_cases_opened_total{scope="site"}[10m])) > 0
        labels: { severity: page }
        annotations:
          summary: "Many devices at one site raised {{ $labels.rule }} together, and a site-wide case was opened."
          description: Several devices failing at once usually share a cause (cooling, power). Start from the site case's device list.

      - alert: CasesWaitingForLogs
        expr: max(connectivity_case_waiting_for_logs_oldest_seconds) > 1800
        for: 5m
        labels: { severity: ticket }
        annotations:
          summary: An open case has waited more than 30 minutes for the log bundle its device collected.
          description: The bundle is stuck at the edge (spool, gateway pass-through) or in the cloud (object store, bundles.uploaded). Follow the bundle ID from the case.

      - alert: CaseGaugesStale
        expr: time() - max(connectivity_case_stats_last_success_timestamp_seconds) > 120
        for: 2m
        labels: { severity: ticket }
        annotations:
          summary: The case service hasn't refreshed its open-case gauges for 2 minutes; the Cases panels are showing old numbers.

  - name: ai-triage
    rules:
      - alert: TriageBacklog
        expr: max(connectivity_triage_pending_cases) > 0
        for: 15m
        labels: { severity: ticket }
        annotations:
          summary: "{{ $value }} cases with logs have waited more than 15 minutes for a triage note."
          description: "The triage outcome panel says why: skipped_budget is the daily budget, skipped_breaker is the model provider, failed means read the notes' errors (make triages)."

      - alert: TriageModelFailing
        expr: |
          sum(rate(connectivity_triage_llm_requests_total{outcome!="ok"}[5m]))
            / sum(rate(connectivity_triage_llm_requests_total[5m])) > 0.5
        for: 5m
        labels: { severity: ticket }
        annotations:
          summary: More than half of the requests to the triage model are failing.
          description: "By outcome: rate_limited means too much concurrency, timeout/overloaded/server_error is the provider, auth is the API key, invalid_output or truncated is the prompt or LLM_MAX_TOKENS."

      - alert: TriageCircuitOpen
        expr: max(connectivity_triage_llm_circuit_open) == 1
        for: 2m
        labels: { severity: ticket }
        annotations:
          summary: The triage model's circuit breaker is open; cases wait for notes until the provider recovers.

      - alert: TriageSpendRateHigh
        expr: sum(rate(connectivity_triage_llm_cost_usd_total[15m])) * 86400 > max(connectivity_triage_budget_limit_usd)
        for: 10m
        labels: { severity: page }
        annotations:
          summary: "Triage is spending at ${{ printf \"%.2f\" $value }} a day, more than its daily budget."
          description: Something is calling the model far more than cases justify (a case triaged on every alert, a retry loop, a flood of cases). The budget will stop the spend within the day; find the cause before it does.

      - alert: TriageBudgetExhausted
        expr: sum(increase(connectivity_triage_cases_total{outcome="skipped_budget"}[10m])) > 0
        labels: { severity: ticket }
        annotations:
          summary: The daily triage budget is spent; new cases get no note until spend falls back under it.

      - alert: TriageNotesUngrounded
        expr: sum(increase(connectivity_triage_grounding_failures_total[1h])) > 3
        labels: { severity: ticket }
        annotations:
          summary: Triage notes are citing log lines, devices or runbooks the model was never given.
          description: The model is making things up. Run the evals against the current model and prompt (make eval) before trusting its notes.

      - alert: TriagePromptInjection
        expr: sum(increase(connectivity_triage_injection_suspected_total[15m])) > 0
        labels: { severity: ticket }
        annotations:
          summary: A device's log contains text aimed at an AI model.
          description: It arrives through a field a customer can edit, like the asset tag. Find the case (make triages) and check what the note did with it.
