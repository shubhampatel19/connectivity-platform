# Connectivity: edge agents -> ingest API -> Kafka -> telemetry processor ->
# Postgres, with log bundles in an S3-compatible object store (SeaweedFS),
# device alerts turned into support cases by the case service, and
# Prometheus and Grafana watching all of it.
#
# Two edge sites: site A's devices talk to the cloud directly; site B's
# devices talk to an on-site gateway (Java) that stores and forwards. Both
# sites reach the cloud through "wan", a Toxiproxy with one link per site,
# so a WAN can be slowed, broken or cut for one site at a time.
#
# The cloud services carry the "cloud" profile. `make up` turns it on, so
# this file runs everything. In cluster mode (`make cluster-up`) the cloud
# runs on k3d instead, and only the edge and the WAN start from here, with
# WAN_UPSTREAM pointing at the cluster's ingress.
#
# Service images build from sibling clones of each component repo. Run
# scripts/bootstrap.sh once to set up that layout.
name: connectivity

configs:
  # Proxies loaded when the WAN starts. Toxics added later (make wan-*) live
  # in memory and are gone after a restart of the wan container.
  wan-proxies:
    content: |
      [
        {"name": "site-a", "listen": "0.0.0.0:18080", "upstream": "${WAN_UPSTREAM:-ingest-api:8080}", "enabled": true},
        {"name": "site-b", "listen": "0.0.0.0:18081", "upstream": "${WAN_UPSTREAM:-ingest-api:8080}", "enabled": true}
      ]

services:
  # ---------- cloud: data plane ----------
  kafka:
    profiles: [cloud]
    image: apache/kafka:3.8.0
    hostname: kafka
    ports:
      - "29092:29092" # for tools on your host
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 20s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  # Topics are created explicitly: partition counts matter for ordering,
  # parallelism and some of the failure drills.
  kafka-init:
    profiles: [cloud]
    image: apache/kafka:3.8.0
    depends_on:
      kafka: { condition: service_healthy }
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic telemetry.raw --partitions 6 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic device.events --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic bundles.uploaded --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic device.alerts --partitions 3 --replication-factor 1
        echo "topics ready"
    restart: "no"

  postgres:
    profiles: [cloud]
    # Postgres 16 with pgvector, for AI triage's runbook embeddings. (Debian-
    # based, unlike the old postgres:16-alpine: a pg-data volume from before
    # Phase 6 needs `make down` once.)
    image: pgvector/pgvector:0.8.0-pg16
    environment:
      POSTGRES_USER: connectivity
      POSTGRES_PASSWORD: connectivity
      POSTGRES_DB: connectivity
    ports:
      - "5432:5432"
    volumes:
      # The telemetry processor, the case service and AI triage each create and
      # migrate their own tables on startup (schemas "cases" and "triage").
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U connectivity -d connectivity"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # Object storage for log bundles: SeaweedFS with its S3 gateway.
  # S3 API on 8333; the filer on 8888 lets you browse stored bundles.
  # Credentials live in seaweedfs/s3.json and must match S3_ACCESS_KEY/S3_SECRET_KEY.
  object-store:
    profiles: [cloud]
    image: chrislusf/seaweedfs:4.47
    command: ["server", "-dir=/data", "-s3", "-s3.port=8333", "-s3.config=/etc/seaweedfs/s3.json", "-metricsPort=9324"]
    ports:
      - "8333:8333"
      - "8888:8888"
    volumes:
      - object-data:/data
      - ./seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9333/cluster/status || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  # ---------- cloud: services ----------
  ingest-api:
    profiles: [cloud]
    build: ../connectivity-ingest-api
    image: connectivity/ingest-api:dev
    environment:
      KAFKA_BROKERS: kafka:9092
      TOKEN_SECRET: ${TOKEN_SECRET:-dev-token-secret-change-me}
      ENROLLMENT_KEY: ${ENROLLMENT_KEY:-dev-enrollment-key}
      S3_ENDPOINT: object-store:8333
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-connectivity}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-connectivity-secret}
      S3_BUCKET: log-bundles
      LOG_LEVEL: ${INGEST_LOG_LEVEL:-info}
    ports:
      - "8080:8080"
    depends_on:
      kafka-init: { condition: service_completed_successfully }
      # Started, not healthy: telemetry must flow even while the object store is down.
      object-store: { condition: service_started }
    restart: unless-stopped

  telemetry-processor:
    profiles: [cloud]
    build: ../connectivity-telemetry-processor
    image: connectivity/telemetry-processor:dev
    environment:
      KAFKA_BROKERS: kafka:9092
      DATABASE_URL: postgres://connectivity:connectivity@postgres:5432/connectivity?sslmode=disable
      LOG_LEVEL: ${PROCESSOR_LOG_LEVEL:-info}
    ports:
      - "9101:9101"
    depends_on:
      kafka-init: { condition: service_completed_successfully }
      postgres: { condition: service_healthy }
    restart: unless-stopped

  # Device alerts -> support cases. Rules come from case-service/rules.json:
  # edit it and `make restart s=case-service` to change thresholds.
  case-service:
    profiles: [cloud]
    build: ../connectivity-case-service
    image: connectivity/case-service:dev
    environment:
      KAFKA_BROKERS: kafka:9092
      DATABASE_URL: postgres://connectivity:connectivity@postgres:5432/connectivity?sslmode=disable
      RULES_FILE: /etc/case-service/rules.json
      LOG_LEVEL: ${CASE_LOG_LEVEL:-info}
    volumes:
      - ./case-service/rules.json:/etc/case-service/rules.json:ro
    ports:
      - "8085:8085"
    depends_on:
      kafka-init: { condition: service_completed_successfully }
      postgres: { condition: service_healthy }
    restart: unless-stopped

  # ---------- AI triage ----------
  # Writes a triage note for every case once its logs arrive. Uses Claude when
  # ANTHROPIC_API_KEY is set, Ollama when OLLAMA_URL is (on the host:
  # http://host.docker.internal:11434), and otherwise a deterministic fake
  # model, so the stack runs with no key and drills can break the model.
  ai-triage:
    profiles: [cloud]
    build: ../connectivity-ai-triage
    image: connectivity/ai-triage:dev
    environment:
      DATABASE_URL: postgresql://connectivity:connectivity@postgres:5432/connectivity
      CASES_URL: http://case-service:8085
      S3_ENDPOINT: object-store:8333
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-connectivity}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-connectivity-secret}
      S3_BUCKET: log-bundles
      LLM_PROVIDER: ${LLM_PROVIDER:-auto}
      LLM_MODEL: ${LLM_MODEL:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OLLAMA_URL: ${OLLAMA_URL:-}
      DAILY_BUDGET_USD: ${TRIAGE_BUDGET_USD:-2}
      FAKE_LLM_FAULTS: ${FAKE_LLM_FAULTS:-}
      POLL_INTERVAL: ${TRIAGE_POLL_INTERVAL:-10}
      LOG_LEVEL: ${TRIAGE_LOG_LEVEL:-info}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8086:8086"
    depends_on:
      postgres: { condition: service_healthy }
      # Started, not healthy: notes wait for the case API, they don't block on it.
      case-service: { condition: service_started }
    restart: unless-stopped

  # ---------- the WAN between the sites and the cloud ----------
  # Toxiproxy: site-a on :18080, site-b on :18081, both forwarding to the
  # cloud's front door. `make wan` shows the links; make wan-latency,
  # wan-bandwidth, wan-flaky, wan-blackhole and wan-down break them.
  wan:
    image: ghcr.io/shopify/toxiproxy:2.12.0
    command: ["-host=0.0.0.0", "-config=/etc/toxiproxy/proxies.json", "-proxy-metrics"]
    configs:
      - source: wan-proxies
        target: /etc/toxiproxy/proxies.json
    ports:
      - "8474:8474" # Toxiproxy API and /metrics
    # In cluster mode the cloud's front door is the k3d load balancer on the
    # Docker host's port 8080.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # ---------- edge: site A, devices talk to the cloud directly ----------
  edge-agent:
    build: ../connectivity-edge-agent
    image: connectivity/edge-agent:dev
    environment:
      INGEST_URL: http://wan:18080
      ENROLLMENT_KEY: ${ENROLLMENT_KEY:-dev-enrollment-key}
      SITE_ID: site-a
      # Cluster mode sets EDGE_OTLP_ENDPOINT (Tempo on host port 4318); empty
      # means no span export, though trace context is still sent.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${EDGE_OTLP_ENDPOINT:-}
      OTEL_TRACES_SAMPLER: parentbased_traceidratio
      OTEL_TRACES_SAMPLER_ARG: ${TRACE_SAMPLE_RATIO:-0.1}
      OTEL_RESOURCE_ATTRIBUTES: site.id=site-a
      DEVICE_COUNT: ${DEVICE_COUNT:-200}
      SEND_INTERVAL: ${SEND_INTERVAL:-5s}
      BUNDLE_INTERVAL: ${BUNDLE_INTERVAL:-30m}
      BUNDLE_TRACE_BYTES: ${BUNDLE_TRACE_BYTES:-2097152}
      FAULT_RATE: ${FAULT_RATE:-1}
      LOG_LEVEL: ${AGENT_LOG_LEVEL:-info}
    ports:
      - "9102:9102"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - wan
    restart: unless-stopped

  # ---------- edge: site B, devices talk to the cloud through a gateway ----------
  # The gateway serves the same /v1 API as the cloud, so the only difference
  # for site B's devices is INGEST_URL. Its queue and inventory live in the
  # gateway-data volume and survive restarts.
  site-gateway:
    build: ../connectivity-site-gateway
    image: connectivity/site-gateway:dev
    environment:
      UPSTREAM_URL: http://wan:18081
      GATEWAY_ID: site-b-gateway
      JAVA_OPTS: ${GATEWAY_JAVA_OPTS:--Xms64m -Xmx256m -XX:+UseG1GC -XX:+ExitOnOutOfMemoryError}
      LOG_LEVEL: ${GATEWAY_LOG_LEVEL:-info}
    ports:
      - "8090:8090"
    volumes:
      - gateway-data:/var/lib/connectivity-gateway
    depends_on:
      - wan
    restart: unless-stopped

  edge-agent-site-b:
    build: ../connectivity-edge-agent
    image: connectivity/edge-agent:dev
    environment:
      INGEST_URL: http://site-gateway:8090
      ENROLLMENT_KEY: ${ENROLLMENT_KEY:-dev-enrollment-key}
      SITE_ID: site-b
      # Cluster mode sets EDGE_OTLP_ENDPOINT (Tempo on host port 4318); empty
      # means no span export, though trace context is still sent.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${EDGE_OTLP_ENDPOINT:-}
      OTEL_TRACES_SAMPLER: parentbased_traceidratio
      OTEL_TRACES_SAMPLER_ARG: ${TRACE_SAMPLE_RATIO:-0.1}
      OTEL_RESOURCE_ATTRIBUTES: site.id=site-b
      DEVICE_COUNT: ${SITE_B_DEVICE_COUNT:-100}
      SEND_INTERVAL: ${SEND_INTERVAL:-5s}
      BUNDLE_INTERVAL: ${BUNDLE_INTERVAL:-30m}
      BUNDLE_TRACE_BYTES: ${BUNDLE_TRACE_BYTES:-2097152}
      FAULT_RATE: ${FAULT_RATE:-1}
      LOG_LEVEL: ${AGENT_LOG_LEVEL:-info}
    ports:
      - "9103:9102"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - site-gateway
    restart: unless-stopped

  # ---------- observability ----------
  kafka-exporter:
    profiles: [cloud]
    image: danielqsj/kafka-exporter:v1.7.0
    command: ["--kafka.server=kafka:9092"]
    depends_on:
      kafka-init: { condition: service_completed_successfully }
    restart: unless-stopped

  prometheus:
    profiles: [cloud]
    image: prom/prometheus:v2.53.0
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports:
      - "9090:9090"
    restart: unless-stopped

  grafana:
    profiles: [cloud]
    image: grafana/grafana:11.1.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/provisioning/dashboards/connectivity-overview.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  pg-data:
  object-data:
  gateway-data:
