# Consumer lag, partition leaders and in-sync replicas, scraped as job
# "kafka" like in compose mode.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-exporter
  labels: { app: kafka-exporter }
spec:
  replicas: 1
  selector:
    matchLabels: { app: kafka-exporter }
  template:
    metadata:
      labels: { app: kafka-exporter }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9308"
        prometheus.io/job: kafka
    spec:
      enableServiceLinks: false
      containers:
        - name: kafka-exporter
          image: danielqsj/kafka-exporter:v1.7.0
          args: ["--kafka.server=kafka:9092"]
          ports:
            - { name: metrics, containerPort: 9308 }
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { memory: 128Mi }
