# Prometheus config for cluster mode. Job names match compose mode, so the
# alert rules and dashboards are shared.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  # Every pod in the namespace annotated prometheus.io/scrape. The job is the
  # pod's app label (ingest-api, case-service, ...), or prometheus.io/job when
  # set (kafka-exporter is job "kafka"). Each replica is its own target, with
  # pod and node labels.
  - job_name: pods
    kubernetes_sd_configs:
      - role: pod
        namespaces: { names: [connectivity] }
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
        regex: "true"
        action: keep
      - source_labels: [__meta_kubernetes_pod_phase]
        regex: Running
        action: keep
      - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
        regex: '([^:]+)(?::\d+)?;(\d+)'
        replacement: $1:$2
        target_label: __address__
      - source_labels: [__meta_kubernetes_pod_label_app]
        target_label: job
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_job]
        regex: (.+)
        target_label: job
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod
      - source_labels: [__meta_kubernetes_pod_node_name]
        target_label: node

  # The edge runs in Docker, outside the cluster. k3d resolves
  # host.k3d.internal to the Docker host, where the agents and the gateway
  # publish their ports. A real cloud could not scrape a customer's site;
  # here it keeps the edge dashboards and alerts working in both modes.
  - job_name: edge-agent
    static_configs:
      - targets: ["host.k3d.internal:9102"]
        labels:
          site: site-a
      - targets: ["host.k3d.internal:9103"]
        labels:
          site: site-b
  - job_name: site-gateway
    static_configs:
      - targets: ["host.k3d.internal:8090"]
        labels:
          site: site-b
  - job_name: wan
    static_configs:
      - targets: ["host.k3d.internal:8474"]

  # Container CPU, memory and throttling from each node's kubelet, through
  # the API server. Only this namespace, only the series the dashboards use.
  - job_name: cadvisor
    scheme: https
    tls_config:
      ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
    authorization:
      credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
    kubernetes_sd_configs:
      - role: node
    relabel_configs:
      - target_label: __address__
        replacement: kubernetes.default.svc:443
      - source_labels: [__meta_kubernetes_node_name]
        target_label: __metrics_path__
        replacement: /api/v1/nodes/$1/proxy/metrics/cadvisor
      - source_labels: [__meta_kubernetes_node_name]
        target_label: node
    metric_relabel_configs:
      - source_labels: [namespace]
        regex: connectivity
        action: keep
      - source_labels: [__name__]
        regex: container_(cpu_usage_seconds_total|cpu_cfs_throttled_periods_total|cpu_cfs_periods_total|memory_working_set_bytes|oom_events_total)
        action: keep
