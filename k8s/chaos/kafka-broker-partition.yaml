# Cut kafka-2 off from the other two brokers for 3 minutes, while clients can
# still reach it. It loses the controller quorum and drops out of every ISR;
# leaders move to kafka-0 and kafka-1. Question: what do clients that still
# send to kafka-2 get back?
apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: kafka-broker-partition
  namespace: connectivity
spec:
  action: partition
  mode: all
  selector:
    pods:
      connectivity: [kafka-2]
  direction: both
  target:
    mode: all
    selector:
      pods:
        connectivity: [kafka-0, kafka-1]
  duration: 3m
