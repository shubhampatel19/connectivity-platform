# Log bundle storage: SeaweedFS with its S3 gateway, as in compose mode.
# S3 API on 8333 (cluster-internal); the filer on 8888 is also reachable from
# the host on port 8888 for browsing stored bundles.
apiVersion: v1
kind: Service
metadata:
  name: object-store
  labels: { app: object-store }
spec:
  selector: { app: object-store }
  ports:
    - { name: s3, port: 8333 }
    - { name: filer, port: 8888 }
    - { name: metrics, port: 9324 }
---
apiVersion: v1
kind: Service
metadata:
  name: object-store-filer-external
  labels: { app: object-store }
spec:
  type: NodePort
  selector: { app: object-store }
  ports:
    - { name: filer, port: 8888, nodePort: 30888 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: object-store
  labels: { app: object-store }
spec:
  serviceName: object-store
  replicas: 1
  selector:
    matchLabels: { app: object-store }
  template:
    metadata:
      labels: { app: object-store }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9324"
    spec:
      enableServiceLinks: false
      containers:
        - name: seaweedfs
          image: chrislusf/seaweedfs:4.47
          args: ["server", "-dir=/data", "-s3", "-s3.port=8333", "-s3.config=/etc/seaweedfs/s3.json", "-metricsPort=9324"]
          ports:
            - { name: s3, containerPort: 8333 }
            - { name: filer, containerPort: 8888 }
            - { name: master, containerPort: 9333 }
            - { name: metrics, containerPort: 9324 }
          readinessProbe:
            httpGet: { path: /cluster/status, port: master }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /cluster/status, port: master }
            periodSeconds: 20
            failureThreshold: 6
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { memory: 512Mi }
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: s3-config, mountPath: /etc/seaweedfs, readOnly: true }
      volumes:
        - name: s3-config
          secret: { secretName: object-store-s3 }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: { storage: 4Gi }
