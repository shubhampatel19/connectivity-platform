# One Postgres instance. The telemetry processor and the case service each
# create and migrate their own tables on startup (the case service's live in
# schema "cases").
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels: { app: postgres }
spec:
  selector: { app: postgres }
  ports:
    - { name: postgres, port: 5432 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels: { app: postgres }
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: { app: postgres }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - { name: POSTGRES_USER, value: connectivity }
            - { name: POSTGRES_DB, value: connectivity }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: connectivity, key: POSTGRES_PASSWORD } }
            # A subdirectory, so initdb never sees a non-empty mount point.
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          ports:
            - { name: postgres, containerPort: 5432 }
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "connectivity", "-d", "connectivity"] }
            periodSeconds: 5
          livenessProbe:
            exec: { command: ["pg_isready", "-U", "connectivity", "-d", "connectivity"] }
            periodSeconds: 20
            failureThreshold: 6
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 512Mi }
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: { storage: 2Gi }
