# Kafka -> Postgres. Two replicas share the telemetry-processor consumer
# group, so killing one triggers a rebalance rather than an outage. Startup
# migrations take an advisory lock, so replicas starting together take turns.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: telemetry-processor
  labels: { app: telemetry-processor }
spec:
  replicas: 2
  selector:
    matchLabels: { app: telemetry-processor }
  template:
    metadata:
      labels: { app: telemetry-processor }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9101"
    spec:
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        # Distroless's "nonroot" user, by number: the kubelet can only verify
        # runAsNonRoot against a numeric UID, not an image's user name.
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: telemetry-processor
          image: connectivity/telemetry-processor
          env:
            - { name: KAFKA_BROKERS, value: "kafka:9092" }
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: connectivity, key: DATABASE_URL } }
            - { name: LOG_LEVEL, value: info }
            # Spans go to Tempo. The sampling decision is the device's
            # (parent-based), so a trace is either whole or absent.
            - { name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://tempo:4318" }
          ports:
            - { name: metrics, containerPort: 9101 }
          # The processor only serves metrics, so liveness can only say the
          # process is up and serving HTTP. A consumer that is stuck but alive
          # passes it; consumer lag is what catches that.
          livenessProbe:
            httpGet: { path: /metrics, port: metrics }
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: telemetry-processor
spec:
  minAvailable: 1
  selector:
    matchLabels: { app: telemetry-processor }
